<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeDesk | Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">TD</div>
      <div><strong>TradeDesk</strong><small>Portfolio Manager</small></div>
    </div>
    <nav>
      <button class="nav-item active" data-route="dashboard"><span>⌂</span> Dashboard</button>
      <button class="nav-item" data-route="operacoes"><span>↕</span> Operações</button>
      <button class="nav-item" data-route="ativos"><span>◈</span> Ativos</button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="eyebrow">VISÃO GERAL</div>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="top-actions">
        <span id="lastUpdate">Atualização: --</span>
        <button class="icon-btn" title="Atualizar" onclick="refreshCurrentPage()">↻</button>
        <button class="primary-btn" onclick="openTradeModal()">+ Nova operação</button>
      </div>
    </header>

    <section id="view-dashboard" class="view active"></section>
    <section id="view-operacoes" class="view"></section>
    <section id="view-ativos" class="view"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeModal()"></div>
  <div class="modal-card">
    <div class="modal-head">
      <div><span class="eyebrow">REGISTRO</span><h2>Nova operação</h2></div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <form id="tradeForm">
      <div class="form-grid">
        <label>Ativo<input name="ticker" placeholder="PETR4" required></label>
        <label>Tipo<select name="tipo"><option value="BUY">Compra</option><option value="SELL">Venda</option></select></label>
        <label>Quantidade<input name="quantidade" type="number" min="0.01" step="0.01" required></label>
        <label>Preço de entrada<input name="preco_entrada" type="number" min="0" step="0.01" required></label>
        <label>Corretagem<input name="corretagem" type="number" step="0.01" value="0"></label>
        <label>Taxas<input name="taxas" type="number" step="0.01" value="0"></label>
      </div>
      <label>Observação<textarea name="observacao" rows="3" placeholder="Setup, tese ou observação..."></textarea></label>
      <div class="modal-actions"><button type="button" class="ghost-btn" onclick="closeModal()">Cancelar</button><button class="primary-btn">Salvar operação</button></div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
